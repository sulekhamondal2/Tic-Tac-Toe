<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tic-Tac-Toe · Redux</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        /* ───────────────────────────── RESET & BASE ───────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a12;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ───────────────────────────── ANIMATED BG ───────────────────────────── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 50%),
                #0a0a12;
        }

        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-particles span {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.1);
        }
        .bg-particles span:nth-child(1) {
            left: 5%;
            width: 12px;
            height: 12px;
            animation-duration: 22s;
            animation-delay: 0s;
        }
        .bg-particles span:nth-child(2) {
            left: 15%;
            width: 6px;
            height: 6px;
            animation-duration: 18s;
            animation-delay: 2s;
        }
        .bg-particles span:nth-child(3) {
            left: 25%;
            width: 16px;
            height: 16px;
            animation-duration: 25s;
            animation-delay: 4s;
        }
        .bg-particles span:nth-child(4) {
            left: 35%;
            width: 8px;
            height: 8px;
            animation-duration: 20s;
            animation-delay: 1s;
        }
        .bg-particles span:nth-child(5) {
            left: 45%;
            width: 20px;
            height: 20px;
            animation-duration: 28s;
            animation-delay: 3s;
        }
        .bg-particles span:nth-child(6) {
            left: 55%;
            width: 5px;
            height: 5px;
            animation-duration: 16s;
            animation-delay: 5s;
        }
        .bg-particles span:nth-child(7) {
            left: 65%;
            width: 14px;
            height: 14px;
            animation-duration: 24s;
            animation-delay: 6s;
        }
        .bg-particles span:nth-child(8) {
            left: 75%;
            width: 9px;
            height: 9px;
            animation-duration: 19s;
            animation-delay: 2s;
        }
        .bg-particles span:nth-child(9) {
            left: 85%;
            width: 18px;
            height: 18px;
            animation-duration: 26s;
            animation-delay: 7s;
        }
        .bg-particles span:nth-child(10) {
            left: 92%;
            width: 7px;
            height: 7px;
            animation-duration: 21s;
            animation-delay: 4s;
        }
        .bg-particles span:nth-child(11) {
            left: 50%;
            width: 10px;
            height: 10px;
            animation-duration: 30s;
            animation-delay: 8s;
        }
        .bg-particles span:nth-child(12) {
            left: 10%;
            width: 22px;
            height: 22px;
            animation-duration: 35s;
            animation-delay: 0s;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        /* ───────────────────────────── APP CONTAINER ───────────────────────────── */
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 12px;
        }

        /* ───────────────────────────── GLASS CARD ───────────────────────────── */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(48px);
            -webkit-backdrop-filter: blur(48px);
            border-radius: 40px;
            padding: 36px 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
            transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .glass::before {
            content: '';
            position: absolute;
            inset: -2px;
            z-index: -1;
            border-radius: 42px;
            background: conic-gradient(from 0deg, transparent, rgba(167, 139, 250, 0.1), transparent 30%, rgba(6, 182, 212, 0.1), transparent 70%, rgba(236, 72, 153, 0.1), transparent);
            animation: rotateBorder 12s linear infinite;
            opacity: 0.6;
        }

        @keyframes rotateBorder {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ───────────────────────────── PAGES ───────────────────────────── */
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .page.active {
            display: flex;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ───────────────────────────── LANDING PAGE ───────────────────────────── */
        #landing .logo {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #8b5cf6, #6d28d9, #2dd4bf);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 4px;
            animation: gradientShift 6s ease infinite;
            filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.25));
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        #landing .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        #landing .tagline {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.6;
            max-width: 260px;
        }

        /* ───────────────────────────── BUTTONS ───────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            border: none;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            min-height: 56px;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.96) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.20);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.35);
        }
        .btn-success:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.5);
        }

        .btn-sm {
            padding: 12px 16px;
            font-size: 14px;
            border-radius: 16px;
            min-height: 48px;
        }

        /* ───────────────────────────── MODE SELECTION ───────────────────────────── */
        #mode-selection {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            animation: fadeSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #mode-selection.show {
            display: flex;
        }

        .mode-btn {
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            min-height: 64px;
            touch-action: manipulation;
        }
        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .mode-btn .icon {
            font-size: 26px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            flex-shrink: 0;
        }
        .mode-btn .label {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .mode-btn .label small {
            font-weight: 400;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        /* ───────────────────────────── NAME ENTRY PAGE ───────────────────────────── */
        #name-entry .name-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        #name-entry .name-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .name-group {
            width: 100%;
            margin-bottom: 16px;
        }
        .name-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .name-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border 0.3s ease;
        }
        .name-group .input-wrap:focus-within {
            border-color: rgba(167, 139, 250, 0.4);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }
        .name-group .input-wrap .mark-icon {
            padding: 0 12px 0 14px;
            font-size: 20px;
            font-weight: 800;
            opacity: 0.7;
        }
        .name-group .input-wrap .mark-icon.x {
            color: #a78bfa;
        }
        .name-group .input-wrap .mark-icon.o {
            color: #34d399;
        }
        .name-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 14px 14px 2px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            min-width: 0;
            height: 48px;
            touch-action: manipulation;
        }
        .name-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }
        .name-actions {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .name-actions .btn {
            flex: 1;
        }

        /* ───────────────────────────── GAME PAGE ───────────────────────────── */
        #game .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #game .turn-indicator {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 44px;
        }
        #game .turn-indicator .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        #game .turn-indicator .dot.x {
            background: #a78bfa;
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
        }
        #game .turn-indicator .dot.o {
            background: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.5);
        }
        #game .turn-indicator .dot.thinking {
            animation: pulseGlow 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.8);
                opacity: 0.4;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        #game .score-display {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 44px;
        }
        #game .score-display span {
            color: rgba(255, 255, 255, 0.8);
        }
        #game .score-display .score-x {
            color: #a78bfa;
        }
        #game .score-display .score-o {
            color: #34d399;
        }
        #game .score-display .divider {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ──────── WIN BANNER (APPEARS AT THE TOP) ──────── */
        #winBanner {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.20), rgba(52, 211, 153, 0.10));
            border: 1px solid rgba(167, 139, 250, 0.3);
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.15);
            backdrop-filter: blur(8px);
            min-height: 48px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #winBanner .highlight-name {
            background: linear-gradient(135deg, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5) translateY(-20px);
                opacity: 0;
            }
            70% {
                transform: scale(1.05) translateY(0);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* ───────────────────────────── BOARD ───────────────────────────── */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            margin: 0 auto 18px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 28px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.4);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .cell {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            color: #fff;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
            min-height: 64px;
        }
        .cell:hover:not(.taken):not(.game-over) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .cell:active:not(.taken):not(.game-over) {
            transform: scale(0.92);
        }
        .cell.taken {
            cursor: default;
        }
        .cell.game-over {
            cursor: default;
        }
        .cell .mark {
            animation: popMark 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .cell .mark.x {
            color: #a78bfa;
            text-shadow: 0 0 60px rgba(167, 139, 250, 0.3);
        }
        .cell .mark.o {
            color: #34d399;
            text-shadow: 0 0 60px rgba(52, 211, 153, 0.3);
        }

        @keyframes popMark {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(8deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Winning highlight */
        .cell.win {
            background: rgba(167, 139, 250, 0.15) !important;
            border-color: rgba(167, 139, 250, 0.4) !important;
            box-shadow: 0 0 50px rgba(167, 139, 250, 0.25), inset 0 0 30px rgba(167, 139, 250, 0.1) !important;
            animation: winPulse 1.2s ease-in-out infinite alternate;
        }
        .cell.win .mark {
            color: #c4b5fd !important;
            text-shadow: 0 0 80px rgba(167, 139, 250, 0.6) !important;
        }

        @keyframes winPulse {
            0% {
                box-shadow: 0 0 30px rgba(167, 139, 250, 0.15), inset 0 0 20px rgba(167, 139, 250, 0.05);
            }
            100% {
                box-shadow: 0 0 80px rgba(167, 139, 250, 0.35), inset 0 0 40px rgba(167, 139, 250, 0.15);
            }
        }

        /* ───────────────────────────── GAME MESSAGE ───────────────────────────── */
        #game-message {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            min-height: 34px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #game-message.win {
            color: #a78bfa;
        }
        #game-message.draw {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ───────────────────────────── GAME ACTIONS ───────────────────────────── */
        .game-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .game-actions .btn {
            flex: 1;
        }

        /* ───────────────────────────── WIN MODAL (POP UP) ───────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-card {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: modalPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        .modal-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            z-index: -1;
            border-radius: 42px;
            background: conic-gradient(from 0deg, #8b5cf6, #2dd4bf, #8b5cf6);
            animation: rotateBorder 6s linear infinite;
            opacity: 0.5;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.05) rotate(1deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 64px;
            margin-bottom: 4px;
            display: block;
            animation: floatTrophy 2s ease-in-out infinite alternate;
        }

<body>

    </div>

    <!-- ─── APP ─── -->

    <!-- ═══ WIN MODAL (POP UP) ═══ -->
    <div id="winModal" class="modal-overlay">
        <div class="modal-card">
            <span class="modal-icon">🏆</span>
            <h2 id="modalWinnerName">Player</h2>
            <p class="sub-text">wins the game!</p>
            <button id="modalPlayAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SOUND FX – using Web Audio API
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const SoundFX = (() => {
            let ctx = null;

            function getContext() {
                if (!ctx) {
                    ctx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return ctx;
            }

            function playTone(freq, duration, type = 'sine', volume = 0.15) {
                try {
                    const context = getContext();
                    if (context.state === 'suspended') {
                        context.resume();
                    }
                    const osc = context.createOscillator();
                    const gain = context.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(volume, context.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(context.destination);
                    osc.start(context.currentTime);
                    osc.stop(context.currentTime + duration);
                } catch (e) {
                    // silently fail on mobile or if audio not supported
                }
            }

            function playMove() {
                playTone(600, 0.08, 'sine', 0.12);
            }

            function playWin() {
                // Ascending melody: C5, E5, G5, C6
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 0.15, 'sine', 0.13), i * 120);
                });
            }

            function playDraw() {
                // Two descending tones
                playTone(400, 0.15, 'sine', 0.10);
                setTimeout(() => playTone(300, 0.15, 'sine', 0.10), 150);
            }

            function playClick() {
                playTone(800, 0.05, 'sine', 0.08);
            }

            // Resume audio context on any user interaction
            function resumeOnInteraction() {
                const context = getContext();
                if (context && context.state === 'suspended') {
                    context.resume();
                }
            }

            // Attach to global events
            document.addEventListener('click', resumeOnInteraction);
            document.addEventListener('touchstart', resumeOnInteraction);

            return {
                playMove,
                playWin,
                playDraw,
                playClick,
                resume: resumeOnInteraction
            };
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const state = {
            mode: null, // 'local' | 'ai'
            board: Array(9).fill(null),
            currentPlayer: 'X', // 'X' always goes first
            gameOver: false,
            winner: null, // 'X' | 'O' | 'draw' | null
            winCombo: null, // [a, b, c] or null
            scoreX: 0,
            scoreO: 0,
            isAIThinking: false,
            playerXName: 'Player X',
            playerOName: 'Player O',
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const landing = $('#landing');
        const nameEntry = $('#name-entry');
        const gamePage = $('#game');
        const startBtn = $('#startBtn');
        const modeSelection = $('#mode-selection');
        const localBtn = $('#localBtn');
        const aiBtn = $('#aiBtn');
        const board = $('#board');
        const cells = $$('.cell');
        const turnText = $('#turnText');
        const turnDot = $('#turnDot');
        const scoreX = $('#scoreX');
        const scoreO = $('#scoreO');
        const gameMessage = $('#game-message');
        const restartBtn = $('#restartBtn');
        const homeBtn = $('#homeBtn');
        const nameX = $('#nameX');
        const nameO = $('#nameO');
        const nameBackBtn = $('#nameBackBtn');
        const nameStartBtn = $('#nameStartBtn');

        const winBanner = $('#winBanner');
        const bannerWinnerName = $('#bannerWinnerName');
        const winModal = $('#winModal');
        const modalWinnerName = $('#modalWinnerName');
        const modalPlayAgainBtn = $('#modalPlayAgainBtn');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PAGE NAVIGATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            void page.offsetWidth;
            page.classList.add('active');
        }

        function goHome() {
            state.mode = null;
            state.board = Array(9).fill(null);
            state.currentPlayer = 'X';
            state.gameOver = false;
            state.winner = null;
            state.winCombo = null;
            state.isAIThinking = false;
            gameMessage.textContent = '';
            gameMessage.className = '';
            hideWinUI();
            renderBoard();
            updateTurnUI();
            showPage(landing);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  WIN UI CONTROLS (Banner + Modal)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function showWinUI(winnerName) {
            bannerWinnerName.textContent = winnerName;
            modalWinnerName.textContent = winnerName;
            winBanner.style.display = 'flex';
            winModal.classList.add('active');
        }

        function hideWinUI() {
            winBanner.style.display = 'none';
            winModal.classList.remove('active');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BOARD RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderBoard() {
            cells.forEach((cell, i) => {
                const val = state.board[i];
                cell.innerHTML = val ? `<span class="mark ${val === 'X' ? 'x' : 'o'}">${val === 'X' ? '✕' : '○'}</span>` :
                    '';
                cell.classList.toggle('taken', !!val);
                cell.classList.toggle('game-over', state.gameOver);
                cell.classList.remove('win');
            });
            if (state.winCombo) {
                state.winCombo.forEach(i => {
                    cells[i].classList.add('win');
                });
            }
            updateScoreUI();
        }

        function updateScoreUI() {
            scoreX.textContent = state.scoreX;
            scoreO.textContent = state.scoreO;
        }

        function getCurrentPlayerName() {
            if (state.mode === 'ai') {
                return state.currentPlayer === 'X' ? state.playerXName : 'AI';
            }
            return state.currentPlayer === 'X' ? state.playerXName : state.playerOName;
        }

        function updateTurnUI() {
            if (state.gameOver) return;
            const isX = state.currentPlayer === 'X';
            turnDot.className = `dot ${isX ? 'x' : 'o'}`;
            turnDot.classList.remove('thinking');

            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.gameOver) {
                turnText.textContent = 'AI thinking…';
                turnDot.classList.add('thinking');
            } else {
                const name = getCurrentPlayerName();
                turnText.textContent = `${name}'s turn`;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GAME LOGIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const WIN_COMBOS = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function checkWinner(board) {
            for (const combo of WIN_COMBOS) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combo };
                }
            }
            if (board.every(cell => cell !== null)) {
                return { winner: 'draw', combo: null };
            }
            return { winner: null, combo: null };
        }

        function makeMove(index) {
            if (state.gameOver) return false;
            if (state.board[index] !== null) return false;
            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.isAIThinking) return false;

            state.board[index] = state.currentPlayer;
            renderBoard();
            SoundFX.playMove(); // move sound

            const result = checkWinner(state.board);
            if (result.winner) {
                state.gameOver = true;
                state.winner = result.winner;
                state.winCombo = result.combo;
                renderBoard();
                if (result.winner === 'X') state.scoreX++;
                else if (result.winner === 'O') state.scoreO++;
                updateScoreUI();
                showGameOverMessage(result.winner);
                return true;
            }

            state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
            updateTurnUI();

            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.gameOver) {
                triggerAIMove();
            }
            return true;
        }

        function showGameOverMessage(winner) {
            if (winner === 'draw') {
                gameMessage.textContent = '🤝 It\'s a draw!';
                gameMessage.className = 'draw';
                hideWinUI();
                SoundFX.playDraw();
                return;
            }

            let winnerName = winner === 'X' ? state.playerXName : state.playerOName;
            if (state.mode === 'ai' && winner === 'O') winnerName = 'AI';

            showWinUI(winnerName);
            gameMessage.innerHTML = `🏆 <strong>${winnerName}</strong> wins!`;
            gameMessage.className = 'win';
            SoundFX.playWin();
        }

        function resetGame() {
            state.board = Array(9).fill(null);
            state.currentPlayer = 'X';
            state.gameOver = false;
            state.winner = null;
            state.winCombo = null;
            state.isAIThinking = false;
            gameMessage.textContent = '';
            gameMessage.className = '';
            hideWinUI();
            renderBoard();
            updateTurnUI();
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AI (Minimax)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function triggerAIMove() {
            if (state.isAIThinking) return;
            if (state.gameOver) return;
            if (state.currentPlayer !== 'O') return;
            if (state.mode !== 'ai') return;

            state.isAIThinking = true;
            turnDot.classList.add('thinking');
            turnText.textContent = 'AI thinking…';

            setTimeout(() => {
                if (state.gameOver || state.currentPlayer !== 'O') {
                    state.isAIThinking = false;
                    turnDot.classList.remove('thinking');
                    return;
                }
                const best = getBestMove(state.board);
                if (best !== -1) {
                    makeMove(best);
                }
                state.isAIThinking = false;
                turnDot.classList.remove('thinking');
                if (!state.gameOver) {
                    updateTurnUI();
                }
            }, 450);
        }

        function getBestMove(board) {
            let bestScore = -Infinity;
            let bestMove = -1;

            for (let i = 0; i < 9; i++) {
                if (board[i] !== null) continue;
                const newBoard = [...board];
                newBoard[i] = 'O';
                const score = minimax(newBoard, 0, false, -Infinity, Infinity);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
            return bestMove;
        }

        function minimax(board, depth, isMaximizing, alpha, beta) {
            const result = checkWinner(board);
            if (result.winner === 'O') return 10 - depth;
            if (result.winner === 'X') return depth - 10;
            if (result.winner === 'draw') return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'O';
                    const eval_ = minimax(newBoard, depth + 1, false, alpha, beta);
                    maxEval = Math.max(maxEval, eval_);
                    alpha = Math.max(alpha, eval_);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'X';
                    const eval_ = minimax(newBoard, depth + 1, true, alpha, beta);
                    minEval = Math.min(minEval, eval_);
                    beta = Math.min(beta, eval_);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NAME ENTRY HANDLING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function startLocalGameWithNames() {
            const xName = nameX.value.trim() || 'Player X';
            const oName = nameO.value.trim() || 'Player O';
            state.playerXName = xName;
            state.playerOName = oName;
            state.mode = 'local';
            state.scoreX = 0;
            state.scoreO = 0;
            resetGame();
            showPage(gamePage);
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT HANDLERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        startBtn.addEventListener('click', () => {
            const isOpen = modeSelection.classList.contains('show');
            modeSelection.classList.toggle('show');
            startBtn.innerHTML = isOpen ? '▶ &nbsp;Start Game' : '✕ &nbsp;Close';
            SoundFX.playClick();
        });

        localBtn.addEventListener('click', () => {
            showPage(nameEntry);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            if (!nameX.value) nameX.value = 'Player X';
            if (!nameO.value) nameO.value = 'Player O';
            SoundFX.playClick();
        });

        aiBtn.addEventListener('click', () => {
            state.mode = 'ai';
            state.playerXName = 'You';
            state.playerOName = 'AI';
            state.scoreX = 0;
            state.scoreO = 0;
            resetGame();
            showPage(gamePage);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            SoundFX.playClick();
        });

        nameBackBtn.addEventListener('click', () => {
            showPage(landing);
            SoundFX.playClick();
        });

        nameStartBtn.addEventListener('click', startLocalGameWithNames);

        nameX.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameStartBtn.click(); });
        nameO.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameStartBtn.click(); });

        cells.forEach((cell) => {
            cell.addEventListener('click', () => {
                if (state.mode === 'ai' && state.currentPlayer === 'O') return;
                if (state.gameOver) return;
                const index = parseInt(cell.dataset.index);
                makeMove(index);
            });
            // Also touch events to ensure responsiveness
            cell.addEventListener('touchstart', (e) => {
                // Prevent double-firing on mobile
                if (e.touches.length > 1) return;
                // We'll let the click handle it, but we also need to ensure click fires
                // on mobile, but click already works with touch.
            }, { passive: true });
        });

        restartBtn.addEventListener('click', resetGame);

        homeBtn.addEventListener('click', goHome);

        modalPlayAgainBtn.addEventListener('click', () => {
            hideWinUI();
            resetGame();
            SoundFX.playClick();
        });

        winModal.addEventListener('click', (e) => {
            if (e.target === winModal) {
                hideWinUI();
                resetGame();
                SoundFX.playClick();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'r' || e.key === 'R') && gamePage.classList.contains('active')) {
                restartBtn.click();
            }
            if (e.key === 'Escape') {
                if (winModal.classList.contains('active')) {
                    hideWinUI();
                    resetGame();
                } else if (gamePage.classList.contains('active')) {
                    homeBtn.click();
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        showPage(landing);
        renderBoard();
        updateTurnUI();
        hideWinUI();

        // Ensure audio context is resumed on any tap
        document.addEventListener('click', () => SoundFX.resume(), { once: false });
        document.addEventListener('touchstart', () => SoundFX.resume(), { once: false });

        console.log('🎮 Tic-Tac-Toe loaded!');
        console.log('📖 Controls: [R] Restart  [Esc] Home / Close Modal');
        console.log('🔊 Sound effects enabled!');
    </script>

</body>
