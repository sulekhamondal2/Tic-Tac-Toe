<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tic-Tac-Toe · Cartoon</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ───────────────────────────── RESET & BASE ───────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Neue', cursive;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f9e3b3, #ffd6a5, #fdffb8);
            background-attachment: fixed;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 12px;
        }

        /* ───────────────────────────── ANIMATED BG ───────────────────────────── */
        .bg-decor {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-decor span {
            position: absolute;
            font-size: 40px;
            opacity: 0.15;
            animation: floatDecor linear infinite;
        }
        .bg-decor span:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-duration: 25s;
            animation-delay: 0s;
        }
        .bg-decor span:nth-child(2) {
            top: 20%;
            right: 8%;
            animation-duration: 30s;
            animation-delay: 3s;
        }
        .bg-decor span:nth-child(3) {
            bottom: 25%;
            left: 10%;
            animation-duration: 28s;
            animation-delay: 5s;
        }
        .bg-decor span:nth-child(4) {
            bottom: 15%;
            right: 5%;
            animation-duration: 32s;
            animation-delay: 2s;
        }
        .bg-decor span:nth-child(5) {
            top: 50%;
            left: 50%;
            animation-duration: 35s;
            animation-delay: 7s;
        }
        .bg-decor span:nth-child(6) {
            top: 5%;
            left: 45%;
            animation-duration: 27s;
            animation-delay: 4s;
        }
        .bg-decor span:nth-child(7) {
            bottom: 5%;
            left: 30%;
            animation-duration: 29s;
            animation-delay: 6s;
        }

        @keyframes floatDecor {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(30px, -40px) rotate(15deg) scale(1.1);
            }
            50% {
                transform: translate(-20px, -60px) rotate(-10deg) scale(0.9);
            }
            75% {
                transform: translate(40px, -20px) rotate(20deg) scale(1.05);
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
        }

        /* ───────────────────────────── APP CONTAINER ───────────────────────────── */
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
        }

        /* ───────────────────────────── CARTOON CARD ───────────────────────────── */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px 60px 60px 60px;
            padding: 32px 24px;
            border: 4px solid #ffb347;
            box-shadow: 0 12px 0 #cc7a2a, 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .card::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 68px;
            border: 4px dashed rgba(255, 180, 50, 0.3);
            pointer-events: none;
        }

        /* ───────────────────────────── PAGES ───────────────────────────── */
        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .page.active {
            display: flex;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-5deg);
            }
            60% {
                transform: scale(1.05) rotate(1deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ───────────────────────────── LANDING PAGE ───────────────────────────── */
        #landing .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 68px;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 4px;
        }
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        #landing .subtitle {
            font-family: 'Fredoka One', cursive;
            color: #ff6b6b;
            font-size: 18px;
            letter-spacing: 3px;
            text-shadow: 0 2px 0 #cc5555;
            margin-bottom: 12px;
        }
        #landing .tagline {
            color: #5f3b1a;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
            background: rgba(255, 215, 0, 0.2);
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
        }

        /* ───────────────────────────── BUTTONS (cartoon style) ───────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border: 4px solid #333;
            border-radius: 60px;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            position: relative;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 8px 0 #1a1a1a;
            touch-action: manipulation;
            min-height: 56px;
            background: #f39c12;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1a1a1a;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #1a1a1a;
        }

        .btn-primary {
            background: #ff6b6b;
            border-color: #c0392b;
            box-shadow: 0 8px 0 #c0392b;
        }
        .btn-primary:hover {
            box-shadow: 0 10px 0 #c0392b;
        }
        .btn-primary:active {
            box-shadow: 0 4px 0 #c0392b;
        }

        .btn-secondary {
            background: #48dbfb;
            border-color: #0984e3;
            box-shadow: 0 8px 0 #0984e3;
            color: #fff;
        }
        .btn-secondary:hover {
            box-shadow: 0 10px 0 #0984e3;
        }
        .btn-secondary:active {
            box-shadow: 0 4px 0 #0984e3;
        }

        .btn-success {
            background: #2ecc71;
            border-color: #27ae60;
            box-shadow: 0 8px 0 #27ae60;
        }
        .btn-success:hover {
            box-shadow: 0 10px 0 #27ae60;
        }
        .btn-success:active {
            box-shadow: 0 4px 0 #27ae60;
        }

        .btn-warning {
            background: #feca57;
            border-color: #f39c12;
            box-shadow: 0 8px 0 #f39c12;
            color: #333;
        }
        .btn-warning:hover {
            box-shadow: 0 10px 0 #f39c12;
        }
        .btn-warning:active {
            box-shadow: 0 4px 0 #f39c12;
        }

        .btn-outline {
            background: transparent;
            border-color: #333;
            box-shadow: 0 8px 0 #333;
            color: #333;
            text-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 0 #333;
        }
        .btn-outline:active {
            box-shadow: 0 4px 0 #333;
        }

        .btn-sm {
            padding: 10px 16px;
            font-size: 14px;
            min-height: 44px;
        }

        /* ───────────────────────────── MODE SELECTION ───────────────────────────── */
        #mode-selection {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #mode-selection.show {
            display: flex;
        }

        .mode-btn {
            padding: 16px 20px;
            border-radius: 40px;
            border: 4px solid #333;
            background: rgba(255, 255, 255, 0.6);
            color: #333;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            min-height: 64px;
            box-shadow: 0 6px 0 #333;
            touch-action: manipulation;
        }
        .mode-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #333;
        }
        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #333;
        }
        .mode-btn .icon {
            font-size: 30px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            flex-shrink: 0;
            border: 2px solid #333;
        }
        .mode-btn .label {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .mode-btn .label small {
            font-weight: 400;
            font-size: 13px;
            color: #555;
            font-family: 'Comic Neue', cursive;
        }

        /* ───────────────────────────── NAME ENTRY PAGE ───────────────────────────── */
        #name-entry .name-title {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #333;
            margin-bottom: 4px;
            text-shadow: 0 2px 0 #ddd;
        }
        #name-entry .name-sub {
            color: #555;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .name-group {
            width: 100%;
            margin-bottom: 14px;
        }
        .name-group label {
            display: block;
            color: #333;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .name-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 40px;
            border: 4px solid #333;
            transition: border 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .name-group .input-wrap:focus-within {
            border-color: #f39c12;
        }
        .name-group .input-wrap .mark-icon {
            padding: 0 10px 0 16px;
            font-size: 24px;
            font-weight: 800;
            opacity: 0.8;
        }
        .name-group .input-wrap .mark-icon.x {
            color: #ff6b6b;
        }
        .name-group .input-wrap .mark-icon.o {
            color: #48dbfb;
        }
        .name-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 14px 14px 2px;
            color: #333;
            font-family: 'Comic Neue', cursive;
            font-size: 18px;
            font-weight: 700;
            outline: none;
            min-width: 0;
            height: 50px;
            touch-action: manipulation;
        }
        .name-group input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        .name-error {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 14px;
            margin-top: 4px;
            min-height: 20px;
        }
        .name-actions {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .name-actions .btn {
            flex: 1;
        }

        /* ───────────────────────────── DIFFICULTY SELECTION ───────────────────────────── */
        #difficulty-page .diff-title {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            color: #333;
            margin-bottom: 4px;
            text-shadow: 0 2px 0 #ddd;
        }
        #difficulty-page .diff-sub {
            color: #555;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .diff-options {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .diff-btn {
            padding: 16px 20px;
            border-radius: 40px;
            border: 4px solid #333;
            background: #fff;
            color: #333;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 0 #333;
            touch-action: manipulation;
        }
        .diff-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #333;
        }
        .diff-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #333;
        }
        .diff-btn .stars {
            font-size: 24px;
            letter-spacing: 2px;
        }
        .diff-btn.easy {
            background: #ffeaa7;
        }
        .diff-btn.medium {
            background: #fdcb6e;
        }
        .diff-btn.hard {
            background: #ff7675;
            color: #fff;
        }
        .diff-back {
            margin-top: 16px;
        }

        /* ───────────────────────────── GAME PAGE ───────────────────────────── */
        #game .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #game .turn-indicator {
            color: #333;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 16px 6px 10px;
            border-radius: 60px;
            border: 4px solid #333;
            box-shadow: 0 4px 0 #333;
            min-height: 44px;
        }
        #game .turn-indicator .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 2px solid #333;
        }
        #game .turn-indicator .dot.x {
            background: #ff6b6b;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.6);
        }
        #game .turn-indicator .dot.o {
            background: #48dbfb;
            box-shadow: 0 0 12px rgba(72, 219, 251, 0.6);
        }
        #game .turn-indicator .dot.thinking {
            animation: pulseGlow 0.8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        #game .score-display {
            color: #333;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 14px 6px 10px;
            border-radius: 60px;
            border: 4px solid #333;
            box-shadow: 0 4px 0 #333;
            min-height: 44px;
        }
        #game .score-display .score-x {
            color: #ff6b6b;
        }
        #game .score-display .score-o {
            color: #48dbfb;
        }
        #game .score-display .divider {
            color: #888;
        }

        /* ──────── WIN BANNER (cartoon style) ──────── */
        #winBanner {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            border: 4px solid #333;
            padding: 10px 16px;
            border-radius: 60px;
            margin-bottom: 14px;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            color: #fff;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 6px 0 #333;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
            min-height: 48px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #winBanner .highlight-name {
            color: #fff;
            text-shadow: 0 3px 0 #c0392b;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ───────────────────────────── BOARD (cartoon) ───────────────────────────── */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            margin: 0 auto 16px;
            padding: 8px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            border: 6px solid #333;
            box-shadow: inset 0 0 0 4px #ffb347, 0 8px 0 #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .cell {
            background: #fff;
            border-radius: 24px;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            color: #333;
            aspect-ratio: 1 / 1;
            box-shadow: 0 6px 0 #333;
            touch-action: manipulation;
            min-height: 64px;
            font-family: 'Fredoka One', cursive;
        }
        .cell:hover:not(.taken):not(.game-over) {
            transform: scale(1.04);
            background: #f9f9f9;
        }
        .cell:active:not(.taken):not(.game-over) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #333;
        }
        .cell.taken {
            cursor: default;
        }
        .cell.game-over {
            cursor: default;
        }
        .cell .mark {
            animation: popMark 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .cell .mark.x {
            color: #ff6b6b;
            text-shadow: 0 4px 0 #c0392b;
        }
        .cell .mark.o {
            color: #48dbfb;
            text-shadow: 0 4px 0 #0984e3;
            font-size: 100px; 
        }
        @keyframes popMark {
            0% {
                transform: scale(0) rotate(-30deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Winning highlight */
        .cell.win {
            background: #ffeaa7 !important;
            border-color: #f39c12 !important;
            box-shadow: 0 0 0 4px #f39c12, 0 6px 0 #333 !important;
            animation: winPulse 0.8s ease-in-out infinite alternate;
        }
        .cell.win .mark {
            transform: scale(1.1);
        }

        @keyframes winPulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.04);
            }
        }

        /* ───────────────────────────── GAME MESSAGE ───────────────────────────── */
        #game-message {
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            min-height: 38px;
            color: #333;
            margin-bottom: 14px;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 8px;
        }
        #game-message.win {
            color: #ff6b6b;
        }
        #game-message.draw {
            color: #f39c12;
        }

        /* ───────────────────────────── GAME ACTIONS ───────────────────────────── */
        .game-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .game-actions .btn {
            flex: 1;
        }

        /* ───────────────────────────── WIN MODAL (cartoon pop-up) ───────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .modal-card {
            background: #fff;
            border: 6px solid #333;
            border-radius: 60px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: modalPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            box-shadow: 0 12px 0 #333, 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-card::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 68px;
            border: 4px dashed rgba(255, 215, 0, 0.5);
            pointer-events: none;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.2) rotate(-15deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.06) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-icon {
            font-size: 72px;
            margin-bottom: 0px;
            display: block;
            animation: floatTrophy 1.5s ease-in-out infinite alternate;
        }
        @keyframes floatTrophy {
            0% {
                transform: translateY(0) scale(1) rotate(-3deg);
            }
            100% {

        @media (max-width: 380px) {

    </style>
</head>
<body>

    <!-- ─── ANIMATED BACKGROUND DECORATIONS ─── -->
    <div class="bg-decor">

        <span>🦄</span>
        <span>🍭</span>
        <span>🎪</span>
    </div>

    <!-- ─── APP ─── -->
    <div id="app">

        <!-- ═══ LANDING PAGE ═══ -->
        <div id="landing" class="page active card">

                    </span>
                </button>
                <button id="aiBtn" class="mode-btn">
                    <span class="icon">🤖</span>

        <!-- ═══ NAME ENTRY PAGE ═══ -->

            <!-- WIN BANNER -->

            </div>

            <div class="board-wrapper">
                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>

            <div id="game-message"></div>

            <div class="game-actions">
                <button id="restartBtn" class="btn btn-secondary btn-sm">⟳ Restart</button>

    </div>

    <!-- ═══ WIN MODAL (POP UP) ═══ -->
    <div id="winModal" class="modal-overlay">
        <div class="modal-card">
            <span class="modal-icon">🏆</span>
            <h2 id="modalWinnerName">Player</h2>
            <p class="sub-text">wins the game!</p>
            <button id="modalPlayAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SOUND FX – using Web Audio API (cartoon style)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const SoundFX = (() => {
            let ctx = null;

            function getContext() {
                if (!ctx) {
                    ctx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return ctx;
            }

            function playTone(freq, duration, type = 'sine', volume = 0.15) {
                try {
                    const context = getContext();
                    if (context.state === 'suspended') context.resume();
                    const osc = context.createOscillator();
                    const gain = context.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(volume, context.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(context.destination);
                    osc.start(context.currentTime);
                    osc.stop(context.currentTime + duration);
                } catch (e) {}
            }

            function playMove() {
                playTone(700, 0.08, 'sine', 0.12);
            }

            function playWin() {
                // Happy melody: C5, E5, G5, C6, E6
                const notes = [523, 659, 784, 1047, 1319];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 0.15, 'sine', 0.13), i * 100);
                });
            }

            function playDraw() {
                playTone(500, 0.2, 'sawtooth', 0.08);
                setTimeout(() => playTone(400, 0.2, 'sawtooth', 0.08), 200);
            }

            function playClick() {
                playTone(900, 0.05, 'sine', 0.08);
            }

            function resume() {
                const context = getContext();
                if (context && context.state === 'suspended') context.resume();
            }

            document.addEventListener('click', resume);
            document.addEventListener('touchstart', resume);

            return { playMove, playWin, playDraw, playClick, resume };
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const state = {
            mode: null, // 'local' | 'ai'
            difficulty: 'medium', // 'easy' | 'medium' | 'hard'
            board: Array(9).fill(null),
            currentPlayer: 'X',
            gameOver: false,
            winner: null,
            winCombo: null,
            scoreX: 0,
            scoreO: 0,
            isAIThinking: false,
            playerXName: '',
            playerOName: '',
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const landing = $('#landing');
        const nameEntry = $('#name-entry');
        const diffPage = $('#difficulty-page');
        const gamePage = $('#game');
        const startBtn = $('#startBtn');
        const modeSelection = $('#mode-selection');
        const localBtn = $('#localBtn');
        const aiBtn = $('#aiBtn');
        const board = $('#board');
        const cells = $$('.cell');
        const turnText = $('#turnText');
        const turnDot = $('#turnDot');
        const scoreX = $('#scoreX');
        const scoreO = $('#scoreO');
        const gameMessage = $('#game-message');
        const restartBtn = $('#restartBtn');
        const homeBtn = $('#homeBtn');
        const nameX = $('#nameX');
        const nameO = $('#nameO');
        const nameXError = $('#nameXError');
        const nameOError = $('#nameOError');
        const nameBackBtn = $('#nameBackBtn');
        const nameStartBtn = $('#nameStartBtn');
        const diffBackBtn = $('#diffBackBtn');
        const diffBtns = $$('.diff-btn');

        const winBanner = $('#winBanner');
        const bannerWinnerName = $('#bannerWinnerName');
        const winModal = $('#winModal');
        const modalWinnerName = $('#modalWinnerName');
        const modalPlayAgainBtn = $('#modalPlayAgainBtn');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PAGE NAVIGATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            void page.offsetWidth;
            page.classList.add('active');
        }

        function goHome() {
            state.mode = null;
            state.board = Array(9).fill(null);
            state.currentPlayer = 'X';
            state.gameOver = false;
            state.winner = null;
            state.winCombo = null;
            state.isAIThinking = false;
            gameMessage.textContent = '';
            gameMessage.className = '';
            hideWinUI();
            renderBoard();
            updateTurnUI();
            showPage(landing);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  WIN UI
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function showWinUI(winnerName) {
            bannerWinnerName.textContent = winnerName;
            modalWinnerName.textContent = winnerName;
            winBanner.style.display = 'flex';
            winModal.classList.add('active');
        }

        function hideWinUI() {
            winBanner.style.display = 'none';
            winModal.classList.remove('active');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BOARD RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderBoard() {
            cells.forEach((cell, i) => {
                const val = state.board[i];
                cell.innerHTML = val ? `<span class="mark ${val === 'X' ? 'x' : 'o'}">${val === 'X' ? '✕' : '○'}</span>` :
                    '';
                cell.classList.toggle('taken', !!val);
                cell.classList.toggle('game-over', state.gameOver);
                cell.classList.remove('win');
            });
            if (state.winCombo) {
                state.winCombo.forEach(i => {
                    cells[i].classList.add('win');
                });
            }
            updateScoreUI();
        }

        function updateScoreUI() {
            scoreX.textContent = state.scoreX;
            scoreO.textContent = state.scoreO;
        }

        function getCurrentPlayerName() {
            if (state.mode === 'ai') {
                return state.currentPlayer === 'X' ? state.playerXName : 'AI';
            }
            return state.currentPlayer === 'X' ? state.playerXName : state.playerOName;
        }

        function updateTurnUI() {
            if (state.gameOver) return;
            const isX = state.currentPlayer === 'X';
            turnDot.className = `dot ${isX ? 'x' : 'o'}`;
            turnDot.classList.remove('thinking');

            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.gameOver) {
                turnText.textContent = 'AI thinking…';
                turnDot.classList.add('thinking');
            } else {
                const name = getCurrentPlayerName();
                turnText.textContent = `${name}'s turn`;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GAME LOGIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const WIN_COMBOS = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function checkWinner(board) {
            for (const combo of WIN_COMBOS) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combo };
                }
            }
            if (board.every(cell => cell !== null)) {
                return { winner: 'draw', combo: null };
            }
            return { winner: null, combo: null };
        }

        function makeMove(index) {
            if (state.gameOver) return false;
            if (state.board[index] !== null) return false;
            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.isAIThinking) return false;

            state.board[index] = state.currentPlayer;
            renderBoard();
            SoundFX.playMove();

            const result = checkWinner(state.board);
            if (result.winner) {
                state.gameOver = true;
                state.winner = result.winner;
                state.winCombo = result.combo;
                renderBoard();
                if (result.winner === 'X') state.scoreX++;
                else if (result.winner === 'O') state.scoreO++;
                updateScoreUI();
                showGameOverMessage(result.winner);
                return true;
            }

            state.currentPlayer = state.currentPlayer === 'X' ? 'O' : 'X';
            updateTurnUI();

            if (state.mode === 'ai' && state.currentPlayer === 'O' && !state.gameOver) {
                triggerAIMove();
            }
            return true;
        }

        function showGameOverMessage(winner) {
            if (winner === 'draw') {
                gameMessage.textContent = '🤝 It\'s a draw!';
                gameMessage.className = 'draw';
                hideWinUI();
                SoundFX.playDraw();
                return;
            }

            let winnerName = winner === 'X' ? state.playerXName : state.playerOName;
            if (state.mode === 'ai' && winner === 'O') winnerName = 'AI';

            showWinUI(winnerName);
            gameMessage.innerHTML = `🏆 <strong>${winnerName}</strong> wins!`;
            gameMessage.className = 'win';
            SoundFX.playWin();
        }

        function resetGame() {
            state.board = Array(9).fill(null);
            state.currentPlayer = 'X';
            state.gameOver = false;
            state.winner = null;
            state.winCombo = null;
            state.isAIThinking = false;
            gameMessage.textContent = '';
            gameMessage.className = '';
            hideWinUI();
            renderBoard();
            updateTurnUI();
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AI (Minimax with difficulty)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function triggerAIMove() {
            if (state.isAIThinking) return;
            if (state.gameOver) return;
            if (state.currentPlayer !== 'O') return;
            if (state.mode !== 'ai') return;

            state.isAIThinking = true;
            turnDot.classList.add('thinking');
            turnText.textContent = 'AI thinking…';

            setTimeout(() => {
                if (state.gameOver || state.currentPlayer !== 'O') {
                    state.isAIThinking = false;
                    turnDot.classList.remove('thinking');
                    return;
                }
                let bestMove = -1;
                const difficulty = state.difficulty;
              if (difficulty === 'easy') {
    const available = [];
    for (let i = 0; i < 9; i++) {
        if (state.board[i] === null) available.push(i);
    }
    if (available.length > 0) {
        // 80% chance of picking the first cell, 20% random
        if (Math.random() < 0.8) {
            bestMove = available[0]; // first available
        } else {
            const randIdx = Math.floor(Math.random() * available.length);
            bestMove = available[randIdx];
        }
    }
}
                else if (difficulty === 'medium') {
                    // Minimax with depth limit (4)
                    bestMove = getBestMoveWithDepth(state.board, 7);
                } else { // hard
                    bestMove = getBestMove(state.board);
                }

                if (bestMove !== -1) {
                    makeMove(bestMove);
                }
                state.isAIThinking = false;
                turnDot.classList.remove('thinking');
                if (!state.gameOver) {
                    updateTurnUI();
                }
            }, 450);
        }

        function getBestMove(board) {
            let bestScore = -Infinity;
            let bestMove = -1;
            for (let i = 0; i < 9; i++) {
                if (board[i] !== null) continue;
                const newBoard = [...board];
                newBoard[i] = 'O';
                const score = minimax(newBoard, 0, false, -Infinity, Infinity);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
            return bestMove;
        }

        function getBestMoveWithDepth(board, maxDepth) {
            let bestScore = -Infinity;
            let bestMove = -1;
            for (let i = 0; i < 9; i++) {
                if (board[i] !== null) continue;
                const newBoard = [...board];
                newBoard[i] = 'O';
                const score = minimaxDepth(newBoard, 0, false, -Infinity, Infinity, maxDepth);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
            return bestMove;
        }

        function minimax(board, depth, isMaximizing, alpha, beta) {
            const result = checkWinner(board);
            if (result.winner === 'O') return 10 - depth;
            if (result.winner === 'X') return depth - 10;
            if (result.winner === 'draw') return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'O';
                    const eval_ = minimax(newBoard, depth + 1, false, alpha, beta);
                    maxEval = Math.max(maxEval, eval_);
                    alpha = Math.max(alpha, eval_);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'X';
                    const eval_ = minimax(newBoard, depth + 1, true, alpha, beta);
                    minEval = Math.min(minEval, eval_);
                    beta = Math.min(beta, eval_);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function minimaxDepth(board, depth, isMaximizing, alpha, beta, maxDepth) {
            const result = checkWinner(board);
            if (result.winner === 'O') return 10 - depth;
            if (result.winner === 'X') return depth - 10;
            if (result.winner === 'draw') return 0;
            if (depth >= maxDepth) return 0; // evaluation at depth limit

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'O';
                    const eval_ = minimaxDepth(newBoard, depth + 1, false, alpha, beta, maxDepth);
                    maxEval = Math.max(maxEval, eval_);
                    alpha = Math.max(alpha, eval_);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] !== null) continue;
                    const newBoard = [...board];
                    newBoard[i] = 'X';
                    const eval_ = minimaxDepth(newBoard, depth + 1, true, alpha, beta, maxDepth);
                    minEval = Math.min(minEval, eval_);
                    beta = Math.min(beta, eval_);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  NAME ENTRY (mandatory)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function validateNames() {
            let valid = true;
            const xName = nameX.value.trim();
            const oName = nameO.value.trim();
            nameXError.textContent = '';
            nameOError.textContent = '';
            if (!xName) {
                nameXError.textContent = '⚠️ Please enter a name for Player X';
                valid = false;
            }
            if (!oName) {
                nameOError.textContent = '⚠️ Please enter a name for Player O';
                valid = false;
            }
            if (xName && oName && xName.toLowerCase() === oName.toLowerCase()) {
                nameOError.textContent = '⚠️ Names must be different';
                valid = false;
            }
            return valid;
        }

        function startLocalGame() {
            if (!validateNames()) return;
            state.playerXName = nameX.value.trim();
            state.playerOName = nameO.value.trim();
            state.mode = 'local';
            state.scoreX = 0;
            state.scoreO = 0;
            resetGame();
            showPage(gamePage);
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AI START
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function startAIGame(difficulty) {
            state.difficulty = difficulty;
            state.mode = 'ai';
            state.playerXName = 'You';
            state.playerOName = 'AI';
            state.scoreX = 0;
            state.scoreO = 0;
            resetGame();
            showPage(gamePage);
            SoundFX.playClick();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT HANDLERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        startBtn.addEventListener('click', () => {
            const isOpen = modeSelection.classList.contains('show');
            modeSelection.classList.toggle('show');
            startBtn.innerHTML = isOpen ? '▶ &nbsp;Start Game' : '✕ &nbsp;Close';
            SoundFX.playClick();
        });

        localBtn.addEventListener('click', () => {
            showPage(nameEntry);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            // Clear default values and errors
            nameX.value = '';
            nameO.value = '';
            nameXError.textContent = '';
            nameOError.textContent = '';
            SoundFX.playClick();
        });

        aiBtn.addEventListener('click', () => {
            showPage(diffPage);
            modeSelection.classList.remove('show');
            startBtn.innerHTML = '▶ &nbsp;Start Game';
            SoundFX.playClick();
        });

        nameBackBtn.addEventListener('click', () => {
            showPage(landing);
            SoundFX.playClick();
        });

        nameStartBtn.addEventListener('click', startLocalGame);

        nameX.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameStartBtn.click(); });
        nameO.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameStartBtn.click(); });

        diffBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const diff = btn.dataset.diff;
                startAIGame(diff);
            });
        });

        diffBackBtn.addEventListener('click', () => {
            showPage(landing);
            SoundFX.playClick();
        });

        cells.forEach((cell) => {
            cell.addEventListener('click', () => {
                if (state.mode === 'ai' && state.currentPlayer === 'O') return;
                if (state.gameOver) return;
                const index = parseInt(cell.dataset.index);
                makeMove(index);
            });
            cell.addEventListener('touchstart', (e) => {
                // passive to allow click
            }, { passive: true });
        });

        restartBtn.addEventListener('click', resetGame);
        homeBtn.addEventListener('click', goHome);

        modalPlayAgainBtn.addEventListener('click', () => {
            hideWinUI();
            resetGame();
            SoundFX.playClick();
        });

        winModal.addEventListener('click', (e) => {
            if (e.target === winModal) {
                hideWinUI();
                resetGame();
                SoundFX.playClick();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'r' || e.key === 'R') && gamePage.classList.contains('active')) {
                restartBtn.click();
            }
            if (e.key === 'Escape') {
                if (winModal.classList.contains('active')) {
                    hideWinUI();
                    resetGame();
                } else if (gamePage.classList.contains('active')) {
                    homeBtn.click();
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        showPage(landing);
        renderBoard();
        updateTurnUI();
        hideWinUI();
        // ensure name inputs are empty
        nameX.value = '';
        nameO.value = '';

        console.log('🎮 Cartoon Tic-Tac-Toe loaded!');
        console.log('📖 Controls: [R] Restart  [Esc] Home / Close Modal');
        console.log('🔊 Sound effects enabled!');
    </script>
